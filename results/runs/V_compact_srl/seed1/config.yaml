seed: 1
data:
  fov_target_width: 540
  patch_size: 256
  clahe_clip: 2.0
  clahe_tile_px: 64
  split_seed: 2026
  n_val: 5
  targets:
  - stare
  - chase_db1
  - hrf
  extra_targets:
  - fives
model:
  backbone: unet
  width: 8
  dropout: 0.0
  skeleton_head: true
loss:
  lambda_bce: 1.0
  topo: skeleton_recall
  lambda_topo: 0.5
  lambda_skel_head: 0.5
  lambda_cons: 0.5
  skel_iters: 10
  topo_warmup_iters: 0
dg:
  enabled: true
  p_mix: 0.5
  p_color: 0.8
  p_illum: 0.6
  p_haze: 0.4
  p_lowres: 0.4
  p_blur: 0.3
  p_noise: 0.4
  p_jpeg: 0.3
  p_dropout: 0.5
  p_elastic: 0.5
  elastic_alpha: 12.0
  elastic_sigma: 8.0
train:
  iters: 10000
  views_per_step: 16
  lr: 0.001
  lr_schedule: cosine
  weight_decay: 0.0001
  warmup_iters: 300
  grad_clip: 1.0
  val_every: 500
  log_every: 50
  num_workers: 12
  amp: true
eval:
  threshold: 0.5
  threshold_grid:
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  fragment_grid:
  - 0
  - 10
  - 20
  - 30
  - 50
  - 75
  - 100
  - 150
  - 200
  - 300
  mc_samples: 20
  save_prob_maps:
  - 0
  metric_workers: 12
  uncertainty_pixels: 200000
  ece_bins: 15
efficiency:
  input_hw:
  - 512
  - 512
  warmup: 20
  repeats: 100
  cpu_threads: 4
name: V_compact_srl
role: main
