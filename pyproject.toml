[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tglite"
version = "2.0.0"
description = "TG-LiteNet: topology-aware, source-only retinal vessel segmentation study (DRIVE -> STARE / CHASE_DB1 / HRF / FIVES)"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
